---
- name: Install Filebeat prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - ca-certificates
      - apt-transport-https
    state: present
    update_cache: true

- name: Add Elastic repository signing key
  ansible.builtin.shell: |
    curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch \
    | gpg --dearmor \
    | tee /usr/share/keyrings/elastic.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/elastic.gpg

- name: Add Elastic 8.x repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/elastic-8.x.list
    content: |
      deb [signed-by=/usr/share/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main
    mode: "0644"

- name: Update APT cache after adding Elastic repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Filebeat
  ansible.builtin.apt:
    name: "filebeat={{ elk_version }}"
    state: present
    allow_downgrade: true
  notify: Restart Filebeat

- name: Deploy Filebeat configuration
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0600"
  notify: Restart Filebeat

- name: Check Filebeat configuration
  ansible.builtin.command:
    cmd: /usr/bin/filebeat test config -c /etc/filebeat/filebeat.yml
  register: filebeat_config_test
  changed_when: false

- name: Display Filebeat configuration test
  ansible.builtin.debug:
    var: filebeat_config_test.stdout_lines

- name: Test Filebeat output
  ansible.builtin.command:
    cmd: /usr/bin/filebeat test output -c /etc/filebeat/filebeat.yml
  register: filebeat_output_test
  changed_when: false

- name: Display Filebeat output test
  ansible.builtin.debug:
    var: filebeat_output_test.stdout_lines

- name: Ensure Filebeat service is enabled and running
  ansible.builtin.systemd:
    name: filebeat
    enabled: true
    state: started