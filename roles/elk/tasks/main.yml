---
- name: Ensure ELK deployment directory exists
  ansible.builtin.file:
    path: "{{ elk_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Logstash configuration directory exists
  ansible.builtin.file:
    path: "{{ elk_dir }}/logstash"
    state: directory
    mode: "0755"

- name: Configure vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true

- name: Generate Logstash pipeline configuration
  ansible.builtin.template:
    src: logstash.conf.j2
    dest: "{{ elk_dir }}/logstash/logstash.conf"
    mode: "0644"
  notify: Restart Logstash

- name: Generate docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ elk_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start ELK stack using Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ elk_dir }}"
    state: present